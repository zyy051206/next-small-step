name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'dist/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'dist/**', '.github/workflows/android.yml']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate the preinstalled Android SDK tools
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_path" ]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -type f -path '*/bin/sdkmanager' -print | sort -V | tail -n 1)"
          fi
          if [ ! -x "$sdkmanager_path" ] || [ ! -x "$(dirname "$sdkmanager_path")/avdmanager" ]; then
            echo "::error::Android command-line tools were not found inside the runner SDK."
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          dirname "$sdkmanager_path" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"
          "$sdkmanager_path" --version
      - name: Install Android build and emulator packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Install Linux emulator runtime libraries
        run: |
          # Google emulator-container-scripts lists these runtime libraries;
          # libpulse is linked even when the emulator uses -no-audio.
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            libpulse0 libdbus-1-3 libfontconfig1 libx11-6 libx11-xcb1 libxcb1 \
            libxdamage1 libnss3 libxcomposite1 libxcursor1 libxi6 libxext6 \
            libxfixes3 libgl1 libegl1 libxkbcommon0 libxcb-cursor0
          "$ANDROID_HOME/emulator/emulator" -version
      - name: Build and lint the bundled offline app
        run: gradle -p android --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest assembleRelease lintDebug
      - name: Start the Android emulator
        run: |
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/emulator/emulator" -accel-check
          # Older avdmanager and newer emulator disagree on the default user folder.
          # Give both tools an explicit shared AVD directory and fail early if absent.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | avdmanager create avd --name next-step-test --path "$ANDROID_AVD_HOME/next-step-test.avd" --package "system-images;android-35;google_apis;x86_64" --device pixel_6 --force
          test -f "$ANDROID_AVD_HOME/next-step-test.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          adb start-server
          # Use the current supported software renderer; *_indirect modes are deprecated.
          QT_QPA_PLATFORM=offscreen "$ANDROID_HOME/emulator/emulator" -avd next-step-test -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -memory 2048 -cores 2 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          booted=false
          boot_deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$boot_deadline" ]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "::error::The Android emulator exited before boot completed."
              cat "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            boot_status="$(timeout 5 adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$boot_status" = "1" ]; then booted=true; break; fi
            sleep 2
          done
          [ "$booted" = true ] || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }
          adb devices -l
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Verify launch, persistent data, and Android back action
        run: gradle -p android --no-daemon connectedDebugAndroidTest
      - name: Prepare unsigned release, tested debug APK, and signing tool
        run: |
          mkdir -p android/artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk android/artifacts/next-small-step-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/artifacts/next-small-step-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android/artifacts/apksigner.jar
          cd android/artifacts
          sha256sum next-small-step-debug.apk next-small-step-unsigned.apk apksigner.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: next-small-step-android
          path: android/artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
      - name: Capture emulator diagnostics
        if: always()
        run: timeout 10 adb -s emulator-5554 logcat -d -t 2000 > "$RUNNER_TEMP/android-logcat.txt" 2>&1 || true
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: |
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/android-logcat.txt
          if-no-files-found: warn
          retention-days: 14
