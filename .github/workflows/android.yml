name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'dist/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'dist/**', '.github/workflows/android.yml']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android build and emulator packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Build and lint the bundled offline app
        run: gradle -p android --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest assembleRelease lintDebug
      - name: Start the Android emulator
        run: |
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --name next-step-test --package "system-images;android-35;google_apis;x86_64" --device pixel_6 --force
          "$ANDROID_HOME/emulator/emulator" -avd next-step-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          booted=false
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then booted=true; break; fi
            sleep 2
          done
          [ "$booted" = true ] || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Verify launch, persistent data, and Android back action
        run: gradle -p android --no-daemon connectedDebugAndroidTest
      - name: Prepare unsigned release, tested debug APK, and signing tool
        run: |
          mkdir -p android/artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk android/artifacts/next-small-step-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/artifacts/next-small-step-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android/artifacts/apksigner.jar
          cd android/artifacts
          sha256sum next-small-step-debug.apk next-small-step-unsigned.apk apksigner.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: next-small-step-android
          path: android/artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
